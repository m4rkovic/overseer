name: Verify frontend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Domain regression tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Check production bundle size
        run: |
          set -o pipefail
          node scripts/check-bundle.mjs | tee bundle-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: bundle-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: overseer-dist
          path: dist
