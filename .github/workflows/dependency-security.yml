name: Dependency security
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit locked dependency tree
        shell: bash
        run: |
          set +e
          npm audit --json > audit-all.json
          npm audit --omit=dev --json > audit-runtime.json
          node --input-type=module -e '
            import fs from "node:fs";
            for (const file of ["audit-all.json","audit-runtime.json"]) {
              const r=JSON.parse(fs.readFileSync(file,"utf8"));
              if (r.error || !r.metadata?.vulnerabilities) throw Error("Audit unavailable: "+file);
              console.log(file,JSON.stringify(r.metadata.vulnerabilities));
              for(const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(name,v.severity,v.range,JSON.stringify(v.fixAvailable));
              if (file==="audit-runtime.json" && (r.metadata.vulnerabilities.high || r.metadata.vulnerabilities.critical)) process.exitCode=1;
            }
          '
          exit $?
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: audit-*.json
